<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><title>Human Search Traces dataset overview</title><desc>VisualProbe training questions are annotated through mouse interactions. The release contains raw session events and final boxes, not source images or generated text.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="400" rx="20" fill="#f6f9fc"/><text x="34" y="48" font-size="30" fill="#18354a" font-weight="600">Human Search Traces</text><text x="34" y="82" font-size="19" fill="#637386" >1,144 raw training sessions · question-conditioned evidence supervision</text><rect x="34" y="124" width="332" height="155" rx="14" fill="#ffffff" stroke="#dde6ee"/><rect x="34" y="124" width="332" height="6" rx="3" fill="#315c9b"/><text x="56" y="170" font-size="23" fill="#315c9b" font-weight="600">Training question</text><text x="56" y="213" font-size="18" fill="#26384a" >VisualProbe source sample</text><text x="56" y="244" font-size="18" fill="#26384a" >Question + image identifier</text><rect x="434" y="124" width="332" height="155" rx="14" fill="#ffffff" stroke="#dde6ee"/><rect x="434" y="124" width="332" height="6" rx="3" fill="#825fb2"/><text x="456" y="170" font-size="23" fill="#825fb2" font-weight="600">Human interaction</text><text x="456" y="213" font-size="18" fill="#26384a" >Pointer / hover / zoom</text><text x="456" y="244" font-size="18" fill="#26384a" >Evidence-box operations</text><rect x="834" y="124" width="332" height="155" rx="14" fill="#ffffff" stroke="#dde6ee"/><rect x="834" y="124" width="332" height="6" rx="3" fill="#4b8857"/><text x="856" y="170" font-size="23" fill="#4b8857" font-weight="600">Released session</text><text x="856" y="213" font-size="18" fill="#26384a" >Ordered raw events</text><text x="856" y="244" font-size="18" fill="#26384a" >Final boxes + relative time</text><path d="M378 200 H414 M405 192 L415 200 L405 208 M778 200 H814 M805 192 L815 200 L805 208" fill="none" stroke="#90a2b5" stroke-width="3"/><text x="34" y="324" font-size="20" fill="#315c9b" >De-identified annotations · no original images · no generated process text</text><text x="34" y="363" font-size="16" fill="#637386" >Schematic workflow; event types may repeat or be absent.</text></g></svg>